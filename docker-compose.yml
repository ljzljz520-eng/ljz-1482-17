version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: user-center-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: usercenter
      POSTGRES_PASSWORD: usercenter_pass
      POSTGRES_DB: usercenter
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usercenter -d usercenter"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - user-center-net

  backend:
    build: ./backend
    container_name: user-center-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://usercenter:usercenter_pass@db:5432/usercenter?schema=public
      JWT_SECRET: user-center-production-demo-secret-please-rotate
      PORT: 4000
      NODE_ENV: production
      FRONTEND_ORIGIN: http://localhost:3000
      WORKER_HEARTBEAT_TIMEOUT_MS: 7000
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:4000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - user-center-net

  frontend:
    build: ./frontend
    container_name: user-center-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - user-center-net

volumes:
  postgres-data:

networks:
  user-center-net:
    driver: bridge
